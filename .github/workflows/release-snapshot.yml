name: Ventry release snapshot monitor

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-snapshot.yml'
      - 'tools/sync-releases.py'
      - 'data/raschet-releases.json'
      - 'data/raschet-release-notes.json'
      - 'site/releases/index.html'
      - 'tests/test_release_sync.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-snapshot.yml'
      - 'tools/sync-releases.py'
      - 'data/raschet-releases.json'
      - 'data/raschet-release-notes.json'
      - 'site/releases/index.html'
      - 'tests/test_release_sync.py'
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate reviewed snapshot
        run: |
          python3 tools/sync-releases.py --check
          python3 -m unittest discover -s tests -p test_release_sync.py
      - name: Fetch public release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync-releases.py --refresh
      - name: Detect publication drift
        run: |
          python3 tools/sync-releases.py --check
          if ! git diff --quiet -- data/raschet-releases.json site/releases/index.html; then
            echo "::warning::New public metadata requires review before publication."
            git diff -- data/raschet-releases.json site/releases/index.html > release-snapshot.patch
            exit 1
          fi
      - name: Upload candidate for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-snapshot-candidate
          path: release-snapshot.patch
          if-no-files-found: ignore
          retention-days: 7
