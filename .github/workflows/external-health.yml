name: Ventry external availability

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/external-health.yml'

permissions: {}

concurrency:
  group: ventry-external-health-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

jobs:
  external-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public HTTPS from outside the VDS
        shell: bash
        run: |
          set -euo pipefail
          base=https://ventrylab.top
          probe() {
            local health status path
            health=$(curl -fsS --connect-timeout 8 --max-time 15 "$base/healthz") || return 1
            [[ "$health" == ok ]] || return 1
            for path in / /raschet/; do
              status=$(curl -fsS --connect-timeout 8 --max-time 15 -o /dev/null -w '%{http_code}' "$base$path") || return 1
              [[ "$status" == 200 ]] || return 1
            done
          }
          for attempt in 1 2 3; do
            if probe; then
              echo 'VENTRY_EXTERNAL_HEALTH_OK'
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then sleep 10; fi
          done
          echo '::error::Ventry public HTTPS health check failed after three attempts.'
          exit 1
