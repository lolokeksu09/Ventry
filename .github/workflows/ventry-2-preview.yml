name: Ventry 2.0 design preview

on:
  push:
    branches:
      - design/ventry-2.0-visual-preview
  pull_request:
    branches:
      - main
    paths:
      - 'design-previews/ventry-2.0/**'
      - '.github/workflows/ventry-2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser test dependency
        run: |
          python3 -m pip install --quiet --break-system-packages selenium==4.38.0
          command -v google-chrome
          command -v chromedriver
      - name: Render mockup and capture responsive screenshots
        run: |
          set -eu
          mkdir -p design-previews/ventry-2.0/screenshots
          python3 -m http.server 18765 --bind 127.0.0.1 --directory . >/tmp/ventry-v2-preview.log 2>&1 &
          python3 - <<'PY'
          import base64,json,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,900'):
              opts.add_argument(arg)
          b=webdriver.Chrome(options=opts)
          url='http://127.0.0.1:18765/design-previews/ventry-2.0/index.html'
          out=Path('design-previews/ventry-2.0/screenshots')
          results={}
          def js(expr):
              return b.execute_script(expr)
          def screenshot(name,full=False):
              data=b.execute_cdp_cmd('Page.captureScreenshot',{'format':'png','fromSurface':True,'captureBeyondViewport':full})['data']
              (out/name).write_bytes(base64.b64decode(data))
          try:
              for label,w,h in [('mobile-320',320,760),('mobile-390',390,844),('tablet-768',768,1024),('desktop-1440',1440,900)]:
                  b.execute_cdp_cmd('Emulation.setDeviceMetricsOverride',{'width':w,'height':h,'deviceScaleFactor':1,'mobile':w<=768})
                  b.get(url)
                  b.execute_async_script('const done=arguments[0];document.fonts.ready.then(()=>done(true))')
                  loaded=js('return (i=>i.complete&&i.naturalWidth>0)(document.querySelector(".project-visual img"))')
                  info=js('''return {
                    width:innerWidth,
                    docWidth:document.documentElement.scrollWidth,
                    docHeight:document.documentElement.scrollHeight,
                    heroHeight:Math.round(document.querySelector('.hero').getBoundingClientRect().height),
                    h1:document.querySelectorAll('h1').length,
                    dialogs:document.querySelectorAll('dialog').length,
                    sections:['about','method','projects','contact'].map(id=>!!document.getElementById(id)),
                    logo:document.querySelector('.hero-mark use').getAttribute('href'),
                    href:document.querySelector('.project-link').getAttribute('href')
                  }''')
                  print(label,json.dumps(info,ensure_ascii=False),flush=True)
                  assert info['width']==w and info['docWidth']<=w,(label,'overflow',info)
                  assert info['h1']==1 and info['dialogs']==0,(label,'structure',info)
                  assert all(info['sections']) and loaded,(label,'missing content',info)
                  assert info['logo']=='#ventry-brand-shape',(label,'brand altered',info)
                  assert info['href']=='https://135-106-227-179.sslip.io/projects/raschet/',(label,'product href',info)
                  screenshot(f'{label}-first-screen.png')
                  screenshot(f'{label}-full-page.png',True)
                  if w<=720:
                      js("document.querySelector('.mobile-menu summary').click()")
                      assert js("return document.querySelector('.mobile-menu').open"),(label,'menu')
                      if w==390:screenshot('mobile-390-menu.png')
                      js("document.querySelector('.mobile-menu nav a[href=\"#projects\"]').click()")
                      assert not js("return document.querySelector('.mobile-menu').open"),(label,'menu close')
                  else:
                      js("document.querySelector('.desktop-nav a[href=\"#projects\"]').click()")
                  assert js('return location.hash')=='#projects',(label,'anchor')
                  if w in (390,1440):
                      for section in ('about','method','projects','contact'):
                          js(f"document.getElementById('{section}').scrollIntoView({{behavior:'instant',block:'start'}})")
                          time.sleep(.1)
                          screenshot(f'{label}-{section}.png')
                  results[label]=info
              (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          finally:
              b.quit()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ventry-2-visual-concept
          path: design-previews/ventry-2.0/screenshots/
          if-no-files-found: warn
          retention-days: 14
