name: Deploy Ventry

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'deploy/**'
      - 'compose.yaml'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ventry-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Проверить все доступные ветки и историю Git на секреты (Gitleaks)
        run: |
          set -euo pipefail
          # No GitHub token is persisted and the scanner has no network access.
          docker run --rm --network none \
            --volume "$PWD:/repo:ro" --workdir /repo \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --no-banner --redact=100 --log-opts="--all" /repo
      - name: Проверить JS и файлы сайта
        run: |
          set -eu
          node --check site/app.js
          node --check site/company-nav.js
          node --check site/raschet/app.js
          node --check site/raschet/ledger.js
          node --check site/raschet/book-storage.js
          bash -n deploy/ventry-github-status
          python3 tests/deploy-package.py
          node --test tests/raschet-scale.mjs
          node tests/copy-link.cjs
          node --test tests/raschet-history.mjs
          node --test tests/raschet-backups.mjs
          node --test tests/raschet-backup-encryption.mjs
          node --test tests/raschet-deadlines.mjs
          python3 tools/verify-site.py
          python3 tools/verify-security.py
          test -s site/index.html
          test -s site/styles.css
          test -s site/favicon.svg
      - name: Проверить Docker Compose
        run: docker compose -f compose.yaml config --quiet
      - name: Подготовить Go 1.27.4 для исправленной сборки Caddy
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Собрать Caddy 2.11.9 с исправлением CVE-2026-78661
        run: |
          set -euo pipefail
          bash tools/build-patched-caddy.sh
          docker build -t ventry-caddy:patched-test -f deploy/Dockerfile .

      - name: Проверить конфигурацию исправленного Caddy
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" ventry-caddy:patched-test caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Протестировать CSP и закрытые маршруты работающего Caddy
        run: bash tests/security-http.sh
      - name: Передать проверенную сборку Caddy для деплоя
        uses: actions/upload-artifact@v4
        with:
          name: ventry-caddy-patched
          path: deploy/caddy-patched
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Получить прошедшую проверки сборку Caddy
        uses: actions/download-artifact@v4
        with:
          name: ventry-caddy-patched
          path: deploy
      - name: Убедиться в наличии исправленного Caddy
        run: |
          set -euo pipefail
          test -s deploy/caddy-patched
          go version -m deploy/caddy-patched | grep -Eq '^[[:space:]]*dep[[:space:]]+golang.org/x/net[[:space:]]+v0[.]62[.]0([[:space:]]|$)'
      - name: Подготовить SSH
        env:
          VENTRY_SSH_KEY: ${{ secrets.VENTRY_SSH_KEY }}
          VENTRY_KNOWN_HOSTS: ${{ secrets.VENTRY_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VENTRY_SSH_KEY"
          test -n "$VENTRY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VENTRY_SSH_KEY" > "$HOME/.ssh/ventry_key"
          printf '%s\n' "$VENTRY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ventry_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/ventry_key" >/dev/null
      - name: Проверить версию установленного серверного entrypoint
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ventry_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            root@135.106.227.179 ventry-deploy-capabilities | grep -Fxq 'VENTRY_STAGED_DEPLOY_V1'
      - name: Опубликовать пакет через ограниченную SSH-команду
        run: |
          set -euo pipefail
          python3 - <<'PYVERSION'
          import json, os
          from pathlib import Path
          Path('site/version.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA']}))
          PYVERSION
          python3 - <<'PYMANIFEST'
          import hashlib, json
          from pathlib import Path
          manifest = Path('deploy/release-manifest.json')
          files = [Path('compose.yaml')] + [p for directory in ('site', 'deploy') for p in Path(directory).rglob('*') if p.is_file() and p != manifest]
          result = {}
          for path in sorted(files):
              with path.open('rb') as f:
                  result[path.as_posix()] = hashlib.file_digest(f, 'sha256').hexdigest()
          manifest.write_text(json.dumps(result, sort_keys=True) + '\n', encoding='utf-8')
          PYMANIFEST
          tar -czf ventry-release.tar.gz compose.yaml site deploy
          ssh -i "$HOME/.ssh/ventry_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            root@135.106.227.179 ventry-deploy < ventry-release.tar.gz | tee deploy-output.log
          grep -Fxq 'VENTRY_DEPLOY_OK' deploy-output.log
      - name: Проверить HTTPS, перенаправление и 404
        run: |
          set -euo pipefail
          url='https://ventrylab.top'
          legacy='https://135-106-227-179.sslip.io'
          ip='http://135.106.227.179'
          # curl verifies the public certificate chain and hostname (no -k).
          curl --fail --silent --show-error --retry 15 --retry-delay 4 --retry-all-errors --max-time 12 "$url/healthz" | grep -Fx 'ok'
          curl --fail --silent --show-error --max-time 15 --output "$RUNNER_TEMP/ventry-homepage.html" "$url/"
          cmp site/index.html "$RUNNER_TEMP/ventry-homepage.html"
          # Assert production security headers, not only local Caddy tests.
          curl --fail --silent --show-error --head --max-time 15 "$url/" > "$RUNNER_TEMP/ventry-headers"
          grep -Fiq "content-security-policy: default-src 'none'; script-src 'self'; style-src 'self';" "$RUNNER_TEMP/ventry-headers"
          grep -iq '^x-content-type-options: nosniff' "$RUNNER_TEMP/ventry-headers"
          grep -iq '^x-frame-options: DENY' "$RUNNER_TEMP/ventry-headers"
          grep -Eiq '^cache-control: no-cache[[:space:]]*$' "$RUNNER_TEMP/ventry-headers"
          curl --fail --silent --show-error --head --max-time 15 "$url/index.html" > "$RUNNER_TEMP/ventry-index-headers"
          grep -Eiq '^cache-control: no-cache[[:space:]]*$' "$RUNNER_TEMP/ventry-index-headers"

          # Prove the exact release and all shipped assets, including the project page.
          curl --fail --silent --show-error --max-time 15 --output "$RUNNER_TEMP/ventry-version.json" "$url/version.json"
          cmp site/version.json "$RUNNER_TEMP/ventry-version.json"
          while IFS= read -r file; do
            path="${file#site/}"
            curl --fail --silent --show-error --max-time 15 --output "$RUNNER_TEMP/ventry-asset" "$url/$path"
            cmp "$file" "$RUNNER_TEMP/ventry-asset"
          done < <(find site -type f ! -name index.html ! -name version.json | sort)
          for page in about approach projects contact projects/raschet raschet legal privacy; do
            curl --fail --silent --show-error --max-time 15 --output "$RUNNER_TEMP/ventry-page.html" "$url/$page/"
            cmp "site/$page/index.html" "$RUNNER_TEMP/ventry-page.html"
          done
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$ip/")" = 308
          test "$(curl --silent --show-error -o /dev/null -w '%{redirect_url}' "$ip/")" = "$legacy/"
          # Preserve the temporary HTTPS hostname while publishing new canonical URLs.
          curl --fail --silent --show-error --max-time 15 "$legacy/healthz" | grep -Fx 'ok'
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$url/__ventry_not_found__")" = 404
