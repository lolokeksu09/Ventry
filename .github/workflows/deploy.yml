name: Deploy Ventry

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'deploy/**'
      - 'compose.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ventry-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Проверить JS и файлы сайта
        run: |
          set -eu
          node --check site/app.js
          test -s site/index.html
          test -s site/styles.css
          test -s site/favicon.svg
      - name: Проверить Docker Compose
        run: docker compose -f compose.yaml config --quiet
      - name: Проверить конфигурацию Caddy
        run: docker run --rm -e VENTRY_SITE_ADDRESS=135-106-227-179.sslip.io -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Подготовить SSH
        env:
          VENTRY_SSH_KEY: ${{ secrets.VENTRY_SSH_KEY }}
          VENTRY_KNOWN_HOSTS: ${{ secrets.VENTRY_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VENTRY_SSH_KEY"
          test -n "$VENTRY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VENTRY_SSH_KEY" > "$HOME/.ssh/ventry_key"
          printf '%s\n' "$VENTRY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ventry_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/ventry_key" >/dev/null
      - name: Опубликовать пакет через ограниченную SSH-команду
        run: |
          set -euo pipefail
          tar -czf ventry-release.tar.gz compose.yaml site deploy
          ssh -i "$HOME/.ssh/ventry_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            root@135.106.227.179 ventry-deploy < ventry-release.tar.gz | tee deploy-output.log
          grep -Fxq 'VENTRY_DEPLOY_OK' deploy-output.log
      - name: Проверить HTTPS, перенаправление и 404
        run: |
          set -euo pipefail
          url='https://135-106-227-179.sslip.io'
          ip='http://135.106.227.179'
          # curl verifies the public certificate chain and hostname (no -k).
          curl --fail --silent --show-error --retry 15 --retry-delay 4 --retry-all-errors --max-time 12 "$url/healthz" | grep -Fx 'ok'
          curl --fail --silent --show-error --max-time 15 --output "$RUNNER_TEMP/ventry-homepage.html" "$url/"
          grep -q 'Ventry' "$RUNNER_TEMP/ventry-homepage.html"
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$ip/")" = 308
          test "$(curl --silent --show-error -o /dev/null -w '%{redirect_url}' "$ip/")" = "$url/"
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$url/__ventry_not_found__")" = 404
