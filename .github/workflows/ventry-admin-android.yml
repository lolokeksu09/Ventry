name: Ventry Admin Android

on:
  pull_request:
    paths:
      - 'admin-android/**'
      - 'delivery/**'
      - '.github/workflows/ventry-admin-android.yml'
  push:
    branches: [main]
    paths:
      - 'admin-android/**'
      - 'delivery/**'
      - '.github/workflows/ventry-admin-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          sdkmanager_bin="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint and native APK
        run: |
          set -euo pipefail
          gradle -p admin-android testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
          apk=admin-android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='dev.ventry.admin.staging'"
          mkdir -p "$RUNNER_TEMP/admin-build"
          cp "$apk" "$RUNNER_TEMP/admin-build/Ventry-Admin-staging.apk"
          (cd "$RUNNER_TEMP/admin-build" && sha256sum Ventry-Admin-staging.apk > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/admin-build/REVISION"
      - name: Build actual Rust delivery service
        working-directory: delivery/service
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --locked
      - name: Start isolated real staging API
        run: bash admin-android/ci/start-service.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader
          script: bash admin-android/ci/test-emulator.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Ventry-Admin-staging
          path: ${{ runner.temp }}/admin-build/
          if-no-files-found: error
          retention-days: 14
      - name: Stop isolated test service
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ventry-admin-service.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ventry-admin-service.pid")" 2>/dev/null || true
          fi
          docker rm -f ventry-admin-ci || true
          rm -f "$RUNNER_TEMP/ventry-admin-db.conf" "$RUNNER_TEMP/ventry-admin-token"
