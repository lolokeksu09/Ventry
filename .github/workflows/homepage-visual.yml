name: Ventry homepage visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/home-company.css'
      - 'site/company-nav.js'
      - '.github/workflows/homepage-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare browser
        run: |
          python3 -m pip install --quiet --break-system-packages selenium==4.38.0
          command -v google-chrome
          command -v chromedriver
      - name: Render actual site and package standalone HTML
        run: |
          set -eu
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          root = Path('site')
          html = (root/'index.html').read_text(encoding='utf-8')
          css = (root/'home-company.css').read_text(encoding='utf-8')
          for name in ('golos-cyrillic.woff2', 'golos-latin.woff2'):
              encoded = base64.b64encode((root/'fonts'/name).read_bytes()).decode('ascii')
              css = css.replace("url('/fonts/"+name+"')", "url('data:font/woff2;base64,"+encoded+"')")
          for name in ('ventry-mark.webp','raschet-ledger.webp'):
              encoded = base64.b64encode((root/'images'/name).read_bytes()).decode('ascii')
              html = html.replace('/images/'+name, 'data:image/webp;base64,'+encoded)
          html = re.sub(r'  <link rel="preload"[^>]*>\n', '', html)
          html = html.replace('<link rel="stylesheet" href="/home-company.css?v=company-compact-v3">','<style>\n'+css+'\n</style>')
          for name,ver in [('app.js','company-1'),('company-nav.js','company-film-2')]:
              src = (root/name).read_text(encoding='utf-8')
              html = html.replace('<script defer src="/'+name+'?v='+ver+'"></script>', '<script defer>\n'+src+'\n</script>')
          html = html.replace('href="/"','href="#start"')
          for path in ('/projects/raschet/','/legal/','/privacy/'):
              html = html.replace('href="'+path+'"','href="https://135-106-227-179.sslip.io'+path+'"')
          assert '<style>' in html and 'href="/home-company.css' not in html
          assert 'data:image/webp;base64,' in html
          (Path('artifacts')/'Ventry-compact-v3.html').write_text(html,encoding='utf-8')
          PY
          python3 -m http.server 18765 --bind 127.0.0.1 --directory site >/tmp/ventry-preview-http.log 2>&1 &
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.keys import Keys
          options = Options()
          for arg in ('--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--window-size=1440,900'):
              options.add_argument(arg)
          browser = webdriver.Chrome(options=options)
          records={}
          try:
              for label,width,height in (('mobile-320',320,760),('mobile-360',360,800),('mobile-390',390,844),('mobile-430',430,900),('tablet-768',768,1000),('desktop-1440',1440,900)):
                  browser.execute_cdp_cmd('Emulation.setDeviceMetricsOverride',{'width':width,'height':height,'deviceScaleFactor':1,'mobile':width<=768})
                  browser.get('http://127.0.0.1:18765/')
                  browser.execute_script("const img=document.querySelector('.work-thumbnail img');img.loading='eager';img.scrollIntoView({block:'center'});")
                  browser.execute_async_script("const done=arguments[0]; Promise.race([Promise.all([document.fonts.ready,document.querySelector('.work-thumbnail img').decode()]).then(()=>true).catch(()=>false),new Promise(r=>setTimeout(()=>r(false),6000))]).then(done)")
                  browser.execute_script('window.scrollTo(0,0)')
                  time.sleep(.35)
                  record=browser.execute_script("""return {
                    viewport:innerWidth, documentWidth:document.documentElement.scrollWidth,
                    documentHeight:Math.ceil(document.documentElement.scrollHeight),
                    heroHeight:Math.ceil(document.querySelector('.opening').getBoundingClientRect().height),
                    companyHeight:Math.ceil(document.querySelector('.company').getBoundingClientRect().height),
                    methodHeight:Math.ceil(document.querySelector('.method').getBoundingClientRect().height),
                    workHeight:Math.ceil(document.querySelector('.work').getBoundingClientRect().height),
                    contactHeight:Math.ceil(document.querySelector('.reach').getBoundingClientRect().height),
                    heroTitlePx:getComputedStyle(document.querySelector('h1')).fontSize,
                    h1:document.querySelector('h1')?.innerText,
                    h1Count:document.querySelectorAll('h1').length,
                    logoLoaded:[...document.querySelectorAll('.rail-brand img,.mobile-brand img')].every(i=>i.complete&&i.naturalWidth>0),
                    imageLoaded:(i=>i.complete&&i.naturalWidth>0)(document.querySelector('.work-thumbnail img')),
                    projectOnlyInWork:!document.querySelector('#start a[href="/projects/raschet/"]'),
                    mobileHeaderVisible:getComputedStyle(document.querySelector('.mobile-top')).display!=='none',
                    railVisible:getComputedStyle(document.querySelector('.rail')).display!=='none',
                    menuWidth:Math.round(document.querySelector('.mobile-top').getBoundingClientRect().width)
                  }""")
                  print(label,json.dumps(record,ensure_ascii=False),flush=True)
                  assert record['viewport']==width,(label,'viewport',record)
                  assert record['documentWidth']<=width,(label,'overflow',record)
                  if width<=430:
                      assert record['heroHeight']<=380,(label,'cover too tall',record)
                      assert record['documentHeight']<=2600,(label,'page too long',record)
                      assert record['heroHeight'] + 67 < height,(label,'company section not reached in first viewport',record)
                  assert record['h1Count']==1,(label,'headings',record)
                  assert record['logoLoaded'] and record['imageLoaded'],(label,'images',record)
                  assert record['projectOnlyInWork'],(label,'project must be secondary')
                  assert record['mobileHeaderVisible'] == (width<=930), (label,'header visibility')
                  assert record['railVisible'] == (width>930),(label,'rail visibility')
                  if width<=930: assert record['menuWidth']<=width,(label,'menu width')
                  firstfold=browser.execute_cdp_cmd('Page.captureScreenshot',{'format':'png','captureBeyondViewport':False,'fromSurface':True})['data']
                  (Path('artifacts')/(label+'-firstfold.png')).write_bytes(base64.b64decode(firstfold))
                  # Capture the full document without changing the viewport: 100svh must stay at the actual device height.
                  pageHeight=min(6500,browser.execute_script('return Math.ceil(document.documentElement.scrollHeight)'))
                  png=browser.execute_cdp_cmd('Page.captureScreenshot',{
                      'format':'png','captureBeyondViewport':True,'fromSurface':True,
                      'clip':{'x':0,'y':0,'width':width,'height':pageHeight,'scale':1}
                  })['data']
                  (Path('artifacts')/(label+'.png')).write_bytes(base64.b64decode(png))
                  browser.execute_script('window.scrollTo(0,0)')
                  if width<=930:
                      # The menu is a native <details> control: test keyboard open, Escape and link close.
                      browser.execute_script("document.querySelector('.mobile-nav summary').focus()")
                      browser.switch_to.active_element.send_keys(Keys.ENTER)
                      assert browser.execute_script("return document.querySelector('.mobile-nav').open"),(label,'keyboard menu opens')
                      if width==390:
                          menuShot=browser.execute_cdp_cmd('Page.captureScreenshot',{'format':'png','captureBeyondViewport':False,'fromSurface':True})['data']
                          (Path('artifacts')/'mobile-390-menu.png').write_bytes(base64.b64decode(menuShot))
                      browser.switch_to.active_element.send_keys(Keys.ESCAPE)
                      assert not browser.execute_script("return document.querySelector('.mobile-nav').open"),(label,'Escape closes menu')
                      assert browser.execute_script("return document.activeElement===document.querySelector('.mobile-nav summary')"),(label,'Escape restores focus')
                      browser.execute_script("document.querySelector('.mobile-nav summary').click()")
                      browser.execute_script("document.querySelector('.mobile-nav a[href=\"#contact\"]').click()")
                      assert browser.execute_script('return location.hash')=='#contact',(label,'mobile contact')
                      assert not browser.execute_script("return document.querySelector('.mobile-nav').open"),(label,'menu closes')
                  else:
                      browser.execute_script("document.querySelector('.rail-links a[href=\"#contact\"]').click()")
                      assert browser.execute_script('return location.hash')=='#contact',(label,'desktop contact')
                  browser.execute_script("document.querySelector('#contact').scrollIntoView({behavior:'instant'})")
                  time.sleep(.35)
                  active=browser.execute_script("""return [...document.querySelectorAll('.rail-links a[aria-current="location"], .mobile-nav nav a[aria-current="location"]')].map(a=>a.getAttribute('href'))""")
                  assert active==['#contact','#contact'],(label,'active section visible',active)
                  record['contactCurrentInBothMenus']=True
                  browser.execute_script("document.querySelectorAll('.method-entries details')[1].querySelector('summary').click()")
                  assert browser.execute_script("return document.querySelectorAll('.method-entries details')[1].open"),(label,'native accordion')
                  records[label]=record
              browser.execute_cdp_cmd('Emulation.setEmulatedMedia',{'features':[{'name':'prefers-reduced-motion','value':'reduce'}]})
              browser.get('http://127.0.0.1:18765/')
              assert browser.execute_script("return getComputedStyle(document.querySelector('.identity-construction')).animationDuration") in ('0.01ms','1e-05s','0s'), 'reduced motion should disable hero animation'
              records['reducedMotion']=True
              browser.execute_cdp_cmd('Emulation.clearDeviceMetricsOverride',{})
              browser.get(Path('artifacts/Ventry-compact-v3.html').resolve().as_uri())
              stand=browser.execute_script("""return {
                title:document.querySelector('h1')?.innerText,
                logo:(i=>i.complete&&i.naturalWidth>0)(document.querySelector('.mobile-brand img')),
                cssLoaded:document.styleSheets.length>0,
                hasLocalScript:typeof document.querySelector('.mobile-nav').open==='boolean'
              }""")
              print('standalone',json.dumps(stand,ensure_ascii=False),flush=True)
              assert stand['logo'] and stand['cssLoaded'] and stand['hasLocalScript'],stand
              records['standalone']=stand
              Path('artifacts/QA.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          finally:
              browser.quit()
          PY
      - name: Upload Chrome output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ventry-corporate-homepage-preview
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
