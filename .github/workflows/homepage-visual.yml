name: Ventry homepage visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'data/projects.json'
      - 'tools/build-catalog.py'
      - 'tests/test_catalog.py'
      - 'site/home-company.css'
      - 'site/company-nav.js'
      - 'site/inner-pages.css'
      - 'site/app.js'
      - 'site/projects/raschet/index.html'
      - 'site/about/index.html'
      - 'site/approach/index.html'
      - 'site/projects/index.html'
      - 'site/contact/index.html'
      - 'site/legal/index.html'
      - 'site/privacy/index.html'
      - 'site/releases/**'
      - 'site/docs/**'
      - 'site/support/**'
      - 'site/status/**'
      - 'site/explore/**'
      - 'data/navigation.json'
      - 'tools/build-navigation.py'
      - 'tools/verify-performance.py'
      - 'tests/serve-preview.py'
      - 'site/styles.css'
      - 'site/brand.css'
      - 'site/raschet/**'
      - 'tests/visual-pages.py'
      - '.github/workflows/homepage-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check homepage sources
        run: |
          node --check site/company-nav.js
          python3 tools/verify-site.py
          python3 tools/build-navigation.py --check
          python3 tools/build-catalog.py --check
          python3 -m unittest discover -s tests -p test_catalog.py
          python3 - <<'PY'
          from pathlib import Path
          h = Path('site/index.html').read_text()
          assert '<dialog' not in h
          for section in ("about", "method", "projects", "contact"):
              assert f'id="{section}"' in h
          assert '<style' not in h and '<script>' not in h
          assert 'href="/legal/"' in h and 'href="/privacy/"' in h
          PY
      - name: Prepare browser
        run: |
          python3 -m pip install --quiet --break-system-packages selenium==4.38.0
          command -v google-chrome
          command -v chromedriver
      - name: Test sections, capture viewport screenshots and export standalone HTML
        run: |
          set -eu
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          root = Path('site')
          html = (root/'index.html').read_text(encoding='utf-8')
          css = (root/'home-company.css').read_text(encoding='utf-8')
          for name in ('golos-cyrillic.woff2','golos-latin.woff2'):
              encoded = base64.b64encode((root/'fonts'/name).read_bytes()).decode('ascii')
              css = css.replace("url('/fonts/"+name+"')", "url('data:font/woff2;base64,"+encoded+"')")
          for rel, mime in [('images/raschet/android-book.webp','image/webp'), ('images/raschet-icon.svg','image/svg+xml'), ('images/ventry-mark.webp','image/webp')]:
              encoded = base64.b64encode((root/rel).read_bytes()).decode('ascii')
              html = html.replace('src="/'+rel+'"', 'src="data:'+mime+';base64,'+encoded+'"')
          brand = (root/'brand.css').read_text(encoding='utf-8')
          for name in ('golos-cyrillic.woff2','golos-latin.woff2'):
              encoded = base64.b64encode((root/'fonts'/name).read_bytes()).decode('ascii')
              brand = brand.replace("url('/fonts/"+name+"')", "url('data:font/woff2;base64,"+encoded+"')")
          html = html.replace('<link rel="stylesheet" href="/brand.css">','<style>'+brand+'</style>')
          favicon = base64.b64encode((root/'favicon.svg').read_bytes()).decode('ascii')
          html = html.replace('href="/favicon.svg"', 'href="data:image/svg+xml;base64,'+favicon+'"')
          html, css_count = re.subn(r'<link rel="stylesheet" href="/home-company\.css(?:\?[^"]*)?">', lambda _: '<style>\n'+css+'\n</style>', html)
          js = (root/'company-nav.js').read_text(encoding='utf-8')
          html, js_count = re.subn(r'<script defer src="/company-nav\.js(?:\?[^"]*)?"></script>', '', html)
          html = html.replace('</body>','<script>\n'+js+'\n</script>\n</body>')
          for route, anchor in {'/':'#start','/about/':'#about','/approach/':'#method','/projects/':'#projects','/contact/':'#contact'}.items():
              html = html.replace('href="'+route+'"','href="'+anchor+'"')
          for route in ('/projects/raschet/','/legal/','/privacy/','/releases/','/docs/','/support/','/status/','/explore/'):
              html = html.replace('href="'+route+'"','href="https://ventrylab.top'+route+'"')
          assert css_count == js_count == 1
          assert 'src="/images/raschet/android-book.webp"' not in html
          html = html.replace('href="/projects/raschet/#gallery-title"','href="https://ventrylab.top/projects/raschet/#gallery-title"')
          html = html.replace('href="/raschet/?demo=1"','href="https://ventrylab.top/raschet/?demo=1"')
          html = html.replace('href="/contact/#request"','href="https://ventrylab.top/contact/#request"')
          Path('artifacts/Ventry-ui-audit.html').write_text(html,encoding='utf-8')
          PY
          python3 tools/verify-performance.py --output artifacts/performance-budget.json
          python3 tests/serve-preview.py >/tmp/ventry-preview.log 2>&1 &
          python3 tests/visual-pages.py
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ventry-homepage-preview
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
