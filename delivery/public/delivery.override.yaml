# Explicit owner opt-in only. Do not use for private-only installation.
services:
  public-gateway:
    build:
      context: ../..
      dockerfile: delivery/public/Dockerfile
    restart: unless-stopped
    environment:
      VENTRY_UPSTREAM: https://db:18444
      VENTRY_UPSTREAM_TLS_NAME: "${DELIVERY_BIND_IP:-127.0.0.1}"
    volumes:
      - "${DELIVERY_STATE:?set state}/tls/gateway-ca.pem:/run/delivery/ca.pem:ro"
    networks:
      default: {}
      public-ingress:
        aliases: [ventry-public-gateway]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  public-ingress:
    external: true
    name: ventry-delivery-public
