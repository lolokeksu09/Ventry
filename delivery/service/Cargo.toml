[package]
name = "ventry-delivery"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ed25519-dalek = "=2.2.0"
axum = "=0.8.9"
getrandom = "=0.3.4"
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-postgres = { version = "=0.7.18", features = ["with-uuid-1", "with-serde_json-1"] }
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
strip = true
